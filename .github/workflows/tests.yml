name: tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - run: python -m pip install --upgrade pip
      # The same ladder aura.environment climbs. pip 24.1 skips any release
      # whose metadata is not valid PEP 440 and then reports it as missing, so
      # a baseline that needs an older installer would fail here and every
      # Dependabot pull request with it -- scoring this arm on a repository
      # that never worked rather than on what Dependabot proposed.
      # Then, as the arms do, the build tools of the pins' own era for a
      # source distribution a current setuptools can no longer build.
      - run: |
          python -m pip install -r requirements.txt pytest || { python -m pip install -q pip==24.0 && python -m pip install -r requirements.txt pytest; } || { python -m pip install -q setuptools==47.3.1 wheel==0.34.2 && python -m pip install --no-build-isolation -r requirements.txt pytest; }
          python -m pip install "setuptools<70" "pytest==7.1.3"
      # --deselect: tests that fail before anything is bumped. CI judges a
      # pull request absolutely, the arms judge against the baseline; without
      # this the project's own broken test fails every pull request.
      - run: python -m pytest imagemodel/classification/models/tf_keras/applications_load_weight_test.py imagemodel/classification/models/tf_keras/applications_test.py imagemodel/classification/models/tf_keras/imagenet_utils_test.py tests/test_common/test_losses/test_losses_bg_weighted_bce.py tests/test_common/test_losses/test_losses_bg_weighted_cce.py tests/test_common/test_losses/test_losses_weighted_cce.py tests/test_common/test_metrics/test_categorical_accuracy.py tests/test_common/test_metrics/test_categorical_cross_entropy.py tests/test_common/test_metrics/test_cosine_similarity.py tests/test_common/test_utils/test_tf_images.py tests/test_reference_tracking/test_layers/test_extract_patch_layer.py tests/test_reference_tracking/test_layers/test_extract_patch_layer3.py --deselect imagemodel/classification/models/tf_keras/applications_load_weight_test.py::ApplicationsLoadWeightTest::test_application_pretrained_weights_loading --deselect tests/test_common/test_losses/test_losses_bg_weighted_cce.py::TestBGWeightedCCE::test_bg_weighted_categorical_crossentropy_1 --deselect tests/test_common/test_losses/test_losses_bg_weighted_cce.py::TestBGWeightedCCE::test_bg_weighted_categorical_crossentropy_2 --deselect tests/test_common/test_losses/test_losses_bg_weighted_cce.py::TestBGWeightedCCE::test_get_bg_weights --deselect tests/test_common/test_utils/test_tf_images.py::TestTFImage::test_decode_image --deselect tests/test_common/test_utils/test_tf_images.py::TestTFImage::test_tf_generate_color_map --deselect tests/test_common/test_utils/test_tf_images.py::TestTFImage::test_tf_get_all_colors --deselect tests/test_common/test_utils/test_tf_images.py::TestTFImage::test_tf_img_to_minmax
